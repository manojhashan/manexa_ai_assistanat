[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "manexa-ai"
version = "0.2.4"
description = "MANEXA AI — Your Intelligent Personal Assistant. Windows desktop foundation."
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = "MIT"
dependencies = [
    "PySide6>=6.8,<6.9",
    "httpx>=0.28,<0.29",
    "keyring>=25,<26",
    "psutil>=6,<8",
    "comtypes>=1.4,<2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
voice = ["faster-whisper>=1.1,<2"]

[project.scripts]
manexa = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.ui" = [
    "web/index.html", "web/scene.css", "web/scene.js", "web/orb.js", "web/hologram.js",
    "web/vendor/three.module.js", "web/vendor/THREE-LICENSE.txt",
]

[tool.setuptools.exclude-package-data]
"app.ui" = ["web/head.js", "web/neck.js", "web/vendor/face-geometry.js",
    "web/vendor/MEDIAPIPE-LICENSE.txt", "web/vendor/LeePerrySmith_License.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

